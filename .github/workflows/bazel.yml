name: Bazel Build & Test

on:
  push:
    branches: [ bazel, bazel-main ]
  pull_request:
    branches: [ bazel, bazel-main, bazel-mac ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Linux, X64]
            name: Linux release
            config: clr_release
          - os: [self-hosted, Linux, X64]
            name: Linux checked
            config: clr_checked
            libs_config: libs_release
          - os: [self-hosted, Linux, X64]
            name: Linux ARM64 (Helix)
            config: clr_release
            libs_config: libs_release
            platforms: //platforms:linux_arm64
            use_helix: true
            cross_image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net11.0-cross-arm64
          - os: [self-hosted, macOS, X64]
            name: macOS release
            config: clr_release
            libs_config: libs_release
          - os: windows-latest
            name: Windows host
            config: clr_release
            libs_config: libs_release
            targets: //src/native/corehost:all

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y clang-18 lld libkrb5-dev liblttng-ust-dev libssl-dev

      - name: Restore Bazel cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ matrix.config }}-${{ matrix.platforms && 'arm64-' || '' }}${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.config }}-${{ matrix.platforms && 'arm64-' || '' }}

      # ---------- Cross-build steps (use_helix: true) ----------

      - name: Cross-build and prepare Helix payloads
        if: ${{ matrix.use_helix }}
        run: |
          eng/bazel/cross-build.sh \
            --image "${{ matrix.cross_image }}" \
            --disk-cache "$HOME/.cache/bazel-disk" \
            --bazel-config "--config=${{ matrix.config }} --config=${{ matrix.libs_config }}" \
            --platforms "${{ matrix.platforms }}"

      - name: Install .NET SDK
        if: ${{ matrix.use_helix }}
        run: |
          SDK_VERSION=$(python3 -c "import json; print(json.load(open('global.json'))['tools']['dotnet'])" 2>/dev/null || true)
          if [[ -z "$SDK_VERSION" ]]; then
            SDK_VERSION=$(python3 -c "import json; print(json.load(open('global.json'))['sdk']['version'])" 2>/dev/null)
          fi
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --version "$SDK_VERSION" --install-dir "$PWD/.dotnet"
          echo "$PWD/.dotnet" >> "$GITHUB_PATH"
          .dotnet/dotnet --version

      - name: Send to Helix
        if: ${{ matrix.use_helix }}
        run: |
          export PATH="$PWD/.dotnet:$PATH"
          dotnet msbuild eng/bazel/sendtohelix.proj \
            /p:Creator="${GITHUB_ACTOR:-bazel-ci}" \
            /p:HelixBuild="${GITHUB_RUN_ID:-local}" \
            /p:TesthostPayload="$PWD/artifacts/helix/testhost" \
            /p:TestPayloadDir="$PWD/artifacts/helix/tests"
        env:
          BUILD_SOURCEBRANCH: refs/heads/${{ github.ref_name }}
          BUILD_REPOSITORY_NAME: ${{ github.repository }}
          SYSTEM_TEAMPROJECT: public
          BUILD_REASON: ${{ github.event_name == 'pull_request' && 'PullRequest' || 'Manual' }}

      - name: Cleanup container
        if: ${{ always() && matrix.use_helix }}
        run: docker rm -f arm64-cross-ci 2>/dev/null || true

      # ---------- Standard build + test steps (no Helix) ----------

      - name: Build
        if: ${{ !matrix.use_helix }}
        run: bazel build ${{ matrix.targets || '//...' }} --config=${{ matrix.config }} ${{ matrix.libs_config && format('--config={0}', matrix.libs_config) || '' }} --disk_cache=~/.cache/bazel-disk

      - name: Test
        if: ${{ !matrix.targets && !matrix.skip_tests && !matrix.use_helix }}
        run: bazel test //... --config=${{ matrix.config }} ${{ matrix.libs_config && format('--config={0}', matrix.libs_config) || '' }} --disk_cache=~/.cache/bazel-disk --test_output=errors

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ matrix.config }}-${{ matrix.platforms && 'arm64-' || '' }}${{ github.sha }}
