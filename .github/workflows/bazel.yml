name: Bazel Build & Test

on:
  push:
    branches: [ bazel, bazel-main ]
  pull_request:
    branches: [ bazel, bazel-main, bazel-mac ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Native build + test (runs tests locally) ----------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Linux, X64]
            name: Linux release
            config: clr_release
          - os: [self-hosted, Linux, X64]
            name: Linux checked
            config: clr_checked
            libs_config: libs_release
          - os: [self-hosted, macOS, X64]
            name: macOS release
            config: clr_release
            libs_config: libs_release
          - os: windows-latest
            name: Windows host
            config: clr_release
            libs_config: libs_release
            targets: //src/native/corehost:all

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y clang-18 lld libkrb5-dev liblttng-ust-dev libssl-dev

      - name: Restore Bazel cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.config }}-

      - name: Build
        run: bazel build ${{ matrix.targets || '//...' }} --config=${{ matrix.config }} ${{ matrix.libs_config && format('--config={0}', matrix.libs_config) || '' }} --disk_cache=~/.cache/bazel-disk

      - name: Test
        if: ${{ !matrix.targets && !matrix.skip_tests }}
        run: bazel test //... --config=${{ matrix.config }} ${{ matrix.libs_config && format('--config={0}', matrix.libs_config) || '' }} --disk_cache=~/.cache/bazel-disk --test_output=errors

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ matrix.config }}-${{ github.sha }}

  # ---------- Cross-build + Helix (builds in container, tests on Helix) ----------
  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64 (Helix)
            config: clr_release
            libs_config: libs_release
            platforms: //platforms:linux_arm64
            cross_image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net11.0-cross-arm64

    name: ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore Bazel cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/bazel-disk
          key: bazel-Linux-arm64-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            bazel-Linux-arm64-${{ matrix.config }}-

      - name: Start cross-build container
        run: |
          BAZEL_BIN="$(which bazelisk 2>/dev/null || which bazel 2>/dev/null || true)"
          DOCKER_ARGS=(-d --name arm64-cross-ci -v "$PWD:/repo")
          [[ -n "$BAZEL_BIN" ]] && DOCKER_ARGS+=(-v "$BAZEL_BIN:/usr/local/bin/bazel")
          mkdir -p "$HOME/.cache/bazel-disk"
          DOCKER_ARGS+=(-v "$HOME/.cache/bazel-disk:/disk-cache")
          docker run "${DOCKER_ARGS[@]}" "${{ matrix.cross_image }}" sleep infinity

      - name: Cross-build and test on Helix
        run: |
          eng/bazel/cross-build.sh \
            --disk-cache "$HOME/.cache/bazel-disk" \
            --bazel-config "--config=${{ matrix.config }} --config=${{ matrix.libs_config }}" \
            --platforms "${{ matrix.platforms }}" \
            --send-to-helix \
            --creator "${GITHUB_ACTOR:-bazel-ci}" \
            --source "pr/${{ github.repository }}/refs/heads/${{ github.ref_name }}"

      - name: Cleanup container
        if: always()
        run: docker rm -f arm64-cross-ci 2>/dev/null || true

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/bazel-disk
          key: bazel-Linux-arm64-${{ matrix.config }}-${{ github.sha }}
